[project]
name = "trend-detective"
version = "0.1.0"
description = "AI agent and MCP server that answers 'is this really changing here?' from NASA and NOAA Earth data. NASA Space Apps 2026."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "langfuse>=5.2,<6",
    "mcp>=1.9",
    "numpy>=2.0",
    "uvicorn>=0.30",
]

[project.scripts]
trend-detective-mcp = "earthtrends.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["earthtrends"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.vercel]
entrypoint = "earthtrends.app:app"
