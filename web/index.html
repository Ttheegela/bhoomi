<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bhoomi</title>
<meta name="description" content="Is this really changing where you live? Pin your places and see what public records say.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta property="og:title" content="Bhoomi">
<meta property="og:description" content="Is this really changing where you live? Pin your places and see what public records say.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://bhoomi.earth/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Bhoomi">
<meta name="twitter:description" content="Is this really changing where you live? Pin your places and see what public records say.">
<script src="prefs.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="map.css">
<link rel="stylesheet" href="compare.css">
<link rel="stylesheet" href="settings.css">
<link rel="stylesheet" href="noise.css">
<link rel="stylesheet" href="chat.css">
</head>
<body>
<p id="td-live" class="sr-only" role="status"></p>
<a class="skip" id="skip" href="#main">Skip to the content</a>

<header class="top">
  <span class="brand">Bhoomi</span>
  <nav id="nav" class="nav" aria-label="Measurements"></nav>
  <div class="right">
    <a id="settings-link" class="btn ghost" href="#settings">Settings</a>
    <span class="ai-label">Built with AI assistance</span>
  </div>
</header>

<div id="win-measure" class="shell">
  <aside class="side" aria-label="Your places">
    <div class="lbl" id="places-lbl">Your places</div>
    <div class="search" id="search">
      <label for="place" class="sr-only" id="place-label">Search for a place</label>
      <span class="mag" aria-hidden="true">⌕</span>
      <input id="place" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="place-list" aria-describedby="place-status" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" maxlength="80" placeholder="Search a town or city">
      <ul id="place-list" role="listbox" aria-labelledby="place-label" hidden></ul>
    </div>
    <p id="place-status" class="help" role="status"></p>
    <p id="place-credit" class="help" hidden></p>
    <ul id="pins" class="pins" aria-label="Pinned places"></ul>
    <p class="hint" id="pin-hint">Pin up to 6 places to compare. Click one to see what its records show.</p>
    <div id="src-field" hidden>
      <div class="lbl" id="src-lbl">Measured by</div>
      <div id="seg-source" class="seg" role="radiogroup" aria-labelledby="src-lbl"></div>
      <p id="src-help" class="hint"></p>
      <p id="src-note" class="hint" hidden></p>
    </div>
    <div>
      <div class="lbl" id="units-lbl">Units</div>
      <div id="seg-units" class="seg" role="radiogroup" aria-labelledby="units-lbl"></div>
    </div>
  </aside>

  <main id="main" class="main">
    <div class="ph">
      <h1 id="win-h1" tabindex="-1"></h1>
      <p id="win-q"></p>
    </div>
    <p id="status-line" class="status-line" role="status" hidden></p>
    <div class="row">
      <section id="rec" class="card rec" aria-busy="false"></section>
      <div id="map-slot" class="map-slot"></div>
    </div>
    <section id="place-chart" class="card pc" aria-labelledby="pc-h" hidden></section>
    <section id="how" class="card how" aria-labelledby="how-h" hidden>
      <h2 id="how-h" tabindex="-1">How we calculated this</h2>
      <p id="how-lead" class="lead"></p>
      <ol id="how-steps" class="steps"></ol>
      <p class="rounded">Numbers are rounded, so the last digit of a sum can differ by 1.</p>
      <div id="noise-slot" class="noise full" hidden></div>
    </section>
    <section class="card ch"><div id="compare-chart-slot"></div></section>
    <section class="card tb"><div id="compare-table-slot"></div></section>
    <footer class="foot">
      <p id="foot-data"></p>
      <ul id="footer-sources"></ul>
    </footer>
  </main>
</div>

<div id="win-settings" class="settings-wrap" hidden>
  <div id="settings-slot"></div>
</div>

<script defer src="explain.js"></script>
<script defer src="app.js"></script>
<script defer src="map.js"></script>
<script defer src="compare.js"></script>
<script defer src="settings.js"></script>
<script defer src="noise.js"></script>
<script defer src="chat.js"></script>
<div id="chat-slot"></div>
</body>
</html>
