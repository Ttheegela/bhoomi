# Golden eval questions for the agent (issue #16).
# Variable ids match earthtrends/data/catalog.py as of PR #24, except water_storage (GRACE not built yet).
# Read by `uv run python -m evals.run` (agent lane). Python reads TOML with tomllib, no new dependency.
#
# Fields:
#   id               unique slug
#   question         what a student types
#   expect_tool      tool the agent must call; "none" = it must NOT call a data tool (can't-answer / clarify cases)
#   expect_variable  id from list_variables (earthtrends/data/catalog.py)
#   expect_place     [lat, lon]; the agent's call must be within 50 km
#   expect_source    source id from docs/CONTRACTS.md, if a specific source must be used
#   expect_verdict   rising | falling | no_clear_change. ONLY set from an independent reference, never from our own tool.
#   must_say         words the answer must contain (case-insensitive)
#   must_not_say     words the answer must not contain
#   reference        where the expected verdict comes from
#
# Sea-level verdicts: NOAA CO-OPS published relative sea level trends (sltrends), all through 2025.

# ---------- Sea level (NOAA tide gauges) ----------

[[case]]
id = "atlantic-city-sea-level"
question = "Is sea level rising in Atlantic City?"
expect_tool = "detect_trend"
expect_variable = "sea_level"
expect_place = [39.36, -74.42]
expect_source = "coops"
expect_verdict = "rising"           # NOAA station 8534720, 1911-2025: clearly rising, error bar far from 0
must_say = ["NOAA"]
must_not_say = []
reference = "https://tidesandcurrents.noaa.gov/sltrends/sltrends_station.shtml?id=8534720"

[[case]]
id = "juneau-sea-level-falling"
question = "Is the sea getting higher in Juneau, Alaska?"
expect_tool = "detect_trend"
expect_variable = "sea_level"
expect_place = [58.30, -134.41]
expect_source = "coops"
expect_verdict = "falling"          # NOAA station 9452210, 1936-2025: falling (land rising after glaciers melted)
must_say = ["NOAA"]
must_not_say = []
reference = "https://tidesandcurrents.noaa.gov/sltrends/sltrends_station.shtml?id=9452210"

[[case]]
id = "astoria-sea-level-no-change"
question = "Has sea level changed in Astoria, Oregon?"
expect_tool = "detect_trend"
expect_variable = "sea_level"
expect_place = [46.21, -123.77]
expect_source = "coops"
expect_verdict = "no_clear_change"  # NOAA station 9439040, 1925-2025: trend within its error bar of 0
must_say = ["NOAA"]
must_not_say = []
reference = "https://tidesandcurrents.noaa.gov/sltrends/sltrends_station.shtml?id=9439040"

[[case]]
id = "port-orford-sea-level-no-change"
question = "is the ocean rising at port orford oregon"
expect_tool = "detect_trend"
expect_variable = "sea_level"
expect_place = [42.74, -124.50]
expect_source = "coops"
expect_verdict = "no_clear_change"  # NOAA station 9431647, 1977-2025: trend within its error bar of 0
must_say = ["NOAA"]
must_not_say = []
reference = "https://tidesandcurrents.noaa.gov/sltrends/sltrends_station.shtml?id=9431647"

# ---------- Heat and rain ----------

[[case]]
id = "delhi-hot-days-sources-disagree"
question = "Are there more days above 40 °C in Delhi than there used to be?"
expect_tool = "detect_trend"
expect_variable = "air_temp_max"   # closest catalog variable (hottest day of the month); no "days above 40 °C" variable yet
expect_place = [28.58, 77.21]
# The reference slopes below count days at or above 40 °C, so they don't apply directly to air_temp_max.
# This case needs era5 and ghcn sources (not built yet) to show the disagreement.
# No expect_verdict: sources disagree for 1981-2015 (POWER -4.4/decade, ERA5 -2.9, Safdarjung station +2.0).
# A correct answer checks more than one source and says they disagree.
must_say = ["disagree"]
must_not_say = []
reference = "Issue #16: POWER -4.4/decade, ERA5 -2.9/decade, GHCN Safdarjung +2.0/decade, 1981-2015"

