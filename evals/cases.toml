# ---------- Groundwater (GRACE) ----------

[[case]]
id = "northwest-india-groundwater"
question = "Is groundwater running out in Punjab and Haryana?"
expect_tool = "detect_trend"
expect_variable = "water_storage"
max_km = 200                        # GRACE is an average over ~400 km; any point inside the region gives the same answer
# Central Punjab/Haryana: within 50 km of both the old point (29.8, 75.8) and the
# point the agent picks (30.5, 75.5, issue #18 comment, Sat 14 Nov). GRACE averages ~400 km anyway.
expect_place = [30.2, 75.7]
expect_source = "grace"
expect_verdict = "falling"          # Rodell et al. 2009 (Nature) and 2018 (Nature): NW India among the strongest GRACE declines
must_say = ["GRACE"]
must_not_say = []
reference = "https://doi.org/10.1038/s41586-018-0123-1"

[[case]]
id = "central-valley-groundwater"
question = "Is California's Central Valley losing groundwater?"
expect_tool = "detect_trend"
expect_variable = "water_storage"
max_km = 200                        # GRACE is an average over ~400 km; any point inside the region gives the same answer
expect_place = [36.60, -119.80]
expect_source = "grace"
expect_verdict = "falling"          # Famiglietti et al. 2011 (GRL); Rodell et al. 2018 (Nature)
must_say = ["GRACE"]
must_not_say = []
reference = "https://doi.org/10.1029/2010GL046442"

# ---------- Can't answer / must clarify ----------

[[case]]
id = "delhi-sea-level-inland"
question = "Is sea level rising in Delhi?"
expect_tool = "none"                # Delhi is inland: no coast, no tide gauge. Decline in plain words.
# No numbers at all: no slope, no distance, no year, no estimate. The runner's "no invented numbers"
# check fails any digit when there is no tool result. It must not switch to another place or measure
# to have something to report; one short sentence offering what could be checked instead is fine.
allow_empty_lookup = true           # looking for a gauge, finding none, then declining is a correct answer (#16)
must_say = ["coast"]
must_not_say = ["mm per", "per decade"]
reference = "Issue #46: do not create numbers when no data exist"

[[case]]
id = "rain-tomorrow-forecast"
question = "Will it rain tomorrow?"
expect_tool = "none"                # a forecast, not a long-term trend
# No required word: models decline correctly in different words ("forecast", "can't predict").
# The no-tool and no-numbers checks carry this case.
must_say = []
must_not_say = ["per decade"]
reference = ""

[[case]]
id = "springfield-ambiguous"
question = "Is it getting warmer in Springfield?"
expect_tool = "none"                # dozens of Springfields; agent must ask which one before calling a tool
must_say = ["which"]
must_not_say = ["per decade"]
reference = ""
