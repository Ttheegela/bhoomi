name: auto-fix
# When `ci` fails on a pull request from this repo, Claude reads the failure, makes the
# smallest fix and pushes it to the same branch. The push comes from the Claude GitHub App,
# so `ci` runs again and auto-merge lands the PR once it is green.
# One attempt per failure: if a commit Claude made still fails, humans take over.
# Runs PR-branch code with secrets available. It therefore runs only for branches of this repository,
# never for a pull request from a fork, and only trusted collaborators get write access.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read
  id-token: write

jobs:
  fix:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0] &&
      github.event.workflow_run.head_commit.author.name != 'claude[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
      - uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc  # v1.0.276
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            The `ci` workflow failed on pull request #${{ github.event.workflow_run.pull_requests[0].number }}
            (branch `${{ github.event.workflow_run.head_branch }}`) in ${{ github.repository }}. Read CLAUDE.md first.
            1. See what failed: `gh run view ${{ github.event.workflow_run.id }} --log-failed`
            2. If the `secrets` job failed, change nothing: a key reached GitHub and must be revoked and replaced.
               Post one comment with `gh pr comment` naming the file and saying the owner must rotate that key, then stop.
            3. Otherwise make the smallest fix, run `uv sync && uv run pytest -q` until it passes,
               commit with a message starting `fix(ci):` and `git push` to the same branch.
            Never edit .github/workflows/, never touch secrets, never force-push.
          claude_args: >-
            --max-turns 20
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(uv sync:*),Bash(uv run pytest:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh run view:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
